version: "1"

services:
  # ============================================================================
  # 1. Backend REST API & Socket.IO Web Service
  # ============================================================================
  - type: web
    name: campus-skill-exchange-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: campus-skill-exchange-client
          property: host

  # ============================================================================
  # 2. Frontend React + Vite + Tailwind CDN Web Application
  # ============================================================================
  - type: web
    name: campus-skill-exchange-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: campus-skill-exchange-api
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: campus-skill-exchange-api
          property: host
